<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img" aria-labelledby="title desc"><title id="title">Fictional review coverage example</title><desc id="desc">A: risk 82%, coverage 91%, reviewed. B: risk 77%, coverage 18%, potential blind spot. C: risk 20%, coverage 12%, low priority.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#070e1c"/></linearGradient></defs><rect width="1200" height="488" rx="20" fill="url(#bg)"/><text x="48" y="49" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#72dce8" text-anchor="start">HUMAN-AWARE COVERAGE</text><text x="1152" y="49" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="end">FICTIONAL EXAMPLE</text><text x="48" y="101" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">EVIDENCE</text><text x="295" y="101" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">FORENSIC RISK</text><text x="620" y="101" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">REVIEW COVERAGE</text><text x="965" y="101" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">REVIEW STATE</text><rect x="28" y="126" width="1144" height="76" rx="12" fill="#0d192b" stroke="#21344c"/><text x="48" y="170" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="start">Evidence A</text><rect x="295" y="158" width="210" height="12" rx="6" fill="#21344c" stroke="#21344c"/><rect x="295" y="158" width="172.2" height="12" rx="6" fill="#72dce8" stroke="#72dce8"/><text x="518" y="170" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf5ff" text-anchor="start">82%</text><rect x="620" y="158" width="210" height="12" rx="6" fill="#21344c" stroke="#21344c"/><rect x="620" y="158" width="191.1" height="12" rx="6" fill="#82cbb2" stroke="#82cbb2"/><text x="843" y="170" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf5ff" text-anchor="start">91%</text><text x="965" y="170" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#82cbb2" text-anchor="start">Reviewed</text><rect x="28" y="221" width="1144" height="76" rx="12" fill="#0d192b" stroke="#21344c"/><text x="48" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="start">Evidence B</text><rect x="295" y="253" width="210" height="12" rx="6" fill="#21344c" stroke="#21344c"/><rect x="295" y="253" width="161.7" height="12" rx="6" fill="#72dce8" stroke="#72dce8"/><text x="518" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf5ff" text-anchor="start">77%</text><rect x="620" y="253" width="210" height="12" rx="6" fill="#21344c" stroke="#21344c"/><rect x="620" y="253" width="37.8" height="12" rx="6" fill="#efb96c" stroke="#efb96c"/><text x="843" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf5ff" text-anchor="start">18%</text><text x="965" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#efb96c" text-anchor="start">BLIND SPOT</text><rect x="28" y="316" width="1144" height="76" rx="12" fill="#0d192b" stroke="#21344c"/><text x="48" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="start">Evidence C</text><rect x="295" y="348" width="210" height="12" rx="6" fill="#21344c" stroke="#21344c"/><rect x="295" y="348" width="42.0" height="12" rx="6" fill="#72dce8" stroke="#72dce8"/><text x="518" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf5ff" text-anchor="start">20%</text><rect x="620" y="348" width="210" height="12" rx="6" fill="#21344c" stroke="#21344c"/><rect x="620" y="348" width="25.2" height="12" rx="6" fill="#96abc3" stroke="#96abc3"/><text x="843" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf5ff" text-anchor="start">12%</text><text x="965" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#96abc3" text-anchor="start">Low priority</text><text x="48" y="451" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#96abc3" text-anchor="start">Illustrative scores, not calibrated probabilities. Review states are examples, not documented thresholds.</text></svg>