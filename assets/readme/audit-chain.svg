<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="345" viewBox="0 0 1200 345" role="img" aria-labelledby="title desc"><title id="title">Three audit entries linked through their previous hashes.</title><desc id="desc">Three audit entries linked through their previous hashes.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#070e1c"/></linearGradient></defs><rect width="1200" height="345" rx="20" fill="url(#bg)"/><text x="48" y="50" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#72dce8" text-anchor="start">CRYPTOGRAPHICALLY CHAINED AUDIT LEDGER</text><rect x="48" y="96" width="340" height="132" rx="12" fill="#0d192b" stroke="#21344c"/><text x="70" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#edf5ff" text-anchor="start">ENTRY 001</text><text x="70" y="171" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#72dce8" text-anchor="start">HASH A</text><text x="70" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">case · evidence · action · timestamp</text><text x="393" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#72dce8" text-anchor="start">→</text><rect x="428" y="96" width="340" height="132" rx="12" fill="#0d192b" stroke="#21344c"/><text x="450" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#edf5ff" text-anchor="start">ENTRY 002</text><text x="450" y="171" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#72dce8" text-anchor="start">HASH B</text><text x="450" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">case · evidence · action · timestamp</text><text x="773" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#72dce8" text-anchor="start">→</text><rect x="808" y="96" width="340" height="132" rx="12" fill="#0d192b" stroke="#21344c"/><text x="830" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#edf5ff" text-anchor="start">ENTRY 003</text><text x="830" y="171" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#72dce8" text-anchor="start">HASH C</text><text x="830" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">case · evidence · action · timestamp</text><text x="48" y="274" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#96abc3" text-anchor="start">Each new hash incorporates the previous hash. Verification exposes a broken chain.</text><text x="48" y="305" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">Conceptual hash labels • Tamper-evident, not tamper-proof</text></svg>