<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Illustrative SYNAPSE dashboard, not a live screenshot</title><desc id="desc">Fictional case workspace showing evidence triage, relationships, coverage and a potential blind spot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#070e1c"/></linearGradient></defs><rect width="1200" height="610" rx="20" fill="url(#bg)"/><text x="44" y="45" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#72dce8" text-anchor="start">SYNAPSE  /  WORKSPACE PREVIEW</text><text x="1156" y="45" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="end">ILLUSTRATIVE MOCKUP</text><path d="M28 66 L1172 66" fill="none" stroke="#21344c" stroke-width="2"/><text x="48" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">Evidence Intelligence</text><text x="48" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">Forensic Triage</text><text x="48" y="209" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">Evidence Graph</text><text x="48" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">AI Analyst</text><text x="48" y="299" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">Coverage</text><text x="48" y="344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#72dce8" text-anchor="start">Blind Spots</text><text x="48" y="389" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">Chain of Custody</text><text x="48" y="434" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="start">Report</text><rect x="274" y="90" width="880" height="74" rx="12" fill="#0d192b" stroke="#21344c"/><text x="296" y="119" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">CASE WORKSPACE</text><text x="296" y="147" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#edf5ff" text-anchor="start">Review the signals. Surface the gaps.</text><rect x="274" y="184" width="282" height="126" rx="12" fill="#0d192b" stroke="#21344c"/><text x="294" y="215" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">FORENSIC RISK</text><text x="294" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#edf5ff" text-anchor="start">77 / 100</text><text x="294" y="285" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#96abc3" text-anchor="start">Elevated signal</text><rect x="573" y="184" width="282" height="126" rx="12" fill="#0d192b" stroke="#21344c"/><text x="593" y="215" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">REVIEW COVERAGE</text><text x="593" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#edf5ff" text-anchor="start">18 / 100</text><text x="593" y="285" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#96abc3" text-anchor="start">Limited observed activity</text><rect x="872" y="184" width="282" height="126" rx="12" fill="#0d192b" stroke="#21344c"/><text x="892" y="215" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">REVIEW PRIORITY</text><text x="892" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="