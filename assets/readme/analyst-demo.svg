<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="413" viewBox="0 0 1200 413" role="img" aria-labelledby="title desc"><title id="title">Scripted example of an AI review recommendation, not output from a real investigation.</title><desc id="desc">Scripted example of an AI review recommendation, not output from a real investigation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#070e1c"/></linearGradient></defs><rect width="1200" height="413" rx="20" fill="url(#bg)"/><text x="48" y="46" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#72dce8" text-anchor="start">SYNAPSE / AI FORENSIC ANALYST</text><text x="1152" y="46" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#efb96c" text-anchor="end">SCRIPTED DEMO</text><path d="M48 70 L1152 70" fill="none" stroke="#21344c" stroke-width="2"/><text x="48" y="114" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">INVESTIGATOR</text><text x="48" y="153" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#edf5ff" text-anchor="start">Which evidence currently deserves the highest review priority?</text><text x="48" y="212" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#72dce8" text-anchor="start">SYNAPSE</text><text x="48" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#edf5ff" text-anchor="start">Evidence EV-DEMO-B has elevated forensic risk with comparatively low review coverage.</text><text x="48" y="283" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#edf5ff" text-anchor="start">Review its extracted indicators and related artifacts first. Validate the findings in context;</text><text x="48" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#edf5ff" text-anchor="start">the available signals alone do not establish maliciousness.</text><text x="48" y="373" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#96abc3" text-anchor="start">AI assists. Evidence decides. Investigators remain accountable.</text></svg>