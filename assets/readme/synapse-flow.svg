<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="title desc"><title id="title">Forensic risk combined with low review coverage informs blind spot priority.</title><desc id="desc">Forensic risk combined with low review coverage informs blind spot priority.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#070e1c"/></linearGradient></defs><rect width="1200" height="292" rx="20" fill="url(#bg)"/><text x="600" y="49" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#72dce8" text-anchor="middle">EVIDENCE COVERAGE ASSURANCE</text><text x="600" y="113" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#edf5ff" text-anchor="middle">FORENSIC RISK × LOW REVIEW COVERAGE</text><text x="600" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#72dce8" text-anchor="middle">↓</text><text x="600" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#efb96c" text-anchor="middle">BLIND SPOT PRIORITY</text><text x="600" y="257" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#96abc3" text-anchor="middle">Conceptual prioritization heuristic · Not proof of maliciousness or investigator error</text></svg>