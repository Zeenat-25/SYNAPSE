<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="title desc"><title id="title">Evidence overload can leave important artifacts under-reviewed.</title><desc id="desc">Evidence overload can leave important artifacts under-reviewed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#070e1c"/></linearGradient></defs><rect width="1200" height="252" rx="20" fill="url(#bg)"/><text x="48" y="52" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#72dce8" text-anchor="start">01 / THE FORENSIC BLIND SPOT</text><rect x="48" y="90" width="258" height="128" rx="12" fill="#0d192b" stroke="#21344c"/><text x="66" y="127" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#edf5ff" text-anchor="start">EVIDENCE OVERLOAD</text><text x="66" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">More artifacts to examine</text><text x="312" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#72dce8" text-anchor="start">›</text><rect x="330" y="90" width="258" height="128" rx="12" fill="#0d192b" stroke="#21344c"/><text x="348" y="127" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#edf5ff" text-anchor="start">UNEVEN ATTENTION</text><text x="348" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">Review becomes inconsistent</text><text x="594" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#72dce8" text-anchor="start">›</text><rect x="612" y="90" width="258" height="128" rx="12" fill="#0d192b" stroke="#21344c"/><text x="630" y="127" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#edf5ff" text-anchor="start">LOW REVIEW</text><text x="630" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">Important evidence gets less time</text><text x="876" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#72dce8" text-anchor="start">›</text><rect x="894" y="90" width="258" height="128" rx="12" fill="#0d192b" stroke="#21344c"/><text x="912" y="127" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#efb96c" text-anchor="start">POTENTIAL BLIND SPOT</text><text x="912" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#96abc3" text-anchor="start">A gap worth investigating</text></svg>